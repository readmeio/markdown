name: Release
on:
  push:
    branches:
      - main
      - beta

permissions:
  id-token: write
  contents: write

jobs:
  Release:
    if: "!contains(github.event.head_commit.message, 'SKIP CI')"
    runs-on: ubuntu-latest
    steps:
      # Setup the git repo & Node environemnt.
      #
      - name: Checkout branch (${{ github.ref }})
        uses: actions/checkout@v7
        with:
          persist-credentials: false # install breaks with persistant creds!

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22.x

      - name: Update npm
        run: npm i -g npm@latest

      - name: Install dependencies
        run: |
          npm ci
          npm run build --if-present
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      # Build, version, and tag a new release.
      #
      - name: Publish release
        run: npm run release # configured in .releaserc
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }} # auth push to remote repo

      # Push release changes to the remote.
      #
      - name: Push to remote
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

      # Merge the version-bump commit back to next (fast-forward when possible).
      #
      - name: Sync main to next
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --unshallow origin 2>/dev/null || true
          git fetch origin main next
          git checkout -B next origin/next
          git merge origin/main -m 'build: sync main into next'
          git push origin next

      # Sync docs to rdmd.readme.io
      #
      - name: Sync docs to rdmd.readme.io
        uses: readmeio/rdme@v10
        with:
          rdme: docs upload ./docs --key=${{ secrets.RDME_KEY }} --version=2
