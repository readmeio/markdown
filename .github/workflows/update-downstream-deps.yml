name: Update Downstream Dependencies

on:
  release:
    types: [published]
  workflow_dispatch:

# Automatic runs are triggered by a published GitHub Release (not a public
# button). Manual retries use the same `release` environment as Cut release so
# only @readmeio/mdxish (or the environment's team) can click Run workflow.
permissions:
  contents: read

concurrency:
  cancel-in-progress: false
  group: update-downstream-deps

jobs:
  authorize:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'readmeio/markdown'
    environment: release
    runs-on: ubuntu-latest
    steps:
      - run: echo authorized

  update-readme:
    name: Update @readme/markdown in readmeio/readme
    needs: authorize
    if: always() && github.repository == 'readmeio/markdown' && (needs.authorize.result == 'success' || needs.authorize.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve published version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "${RELEASE_TAG}" ]; then
            VERSION="${RELEASE_TAG#v}"
          else
            VERSION="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)"
            VERSION="${VERSION#v}"
          fi
          if [ -z "${VERSION}" ] || [ "${VERSION}" = 'unknown' ]; then
            echo 'Could not determine the @readme/markdown version to bump.'
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Resolved version: ${VERSION}"

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.DEPLOY_MARKDOWN_APP_ID }}
          owner: readmeio
          private-key: ${{ secrets.DEPLOY_MARKDOWN_PRIVATE_KEY }}
          repositories: readme

      - name: Checkout readmeio/readme
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: next
          repository: readmeio/readme
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          registry-url: https://registry.npmjs.org

      - name: Wait for npm and run make upgrade-markdown
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # GitHub Release can beat the npm replica by a few seconds.
          for attempt in 1 2 3 4 5 6; do
            published="$(npm view @readme/markdown version)"
            echo "npm @readme/markdown is ${published} (want ${VERSION})"
            if [ "${published}" = "${VERSION}" ]; then
              break
            fi
            if [ "${attempt}" -eq 6 ]; then
              echo "Timed out waiting for @readme/markdown@${VERSION} on npm."
              exit 1
            fi
            sleep 20
          done
          make upgrade-markdown

      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.email 'deploy-markdown[bot]@users.noreply.github.com'
          git config user.name 'deploy-markdown[bot]'

          branch='chore/update-readme-markdown'
          git fetch origin "${branch}" 2>/dev/null || true
          git checkout -B "${branch}"

          git add --all
          if git diff --staged --quiet; then
            echo "readmeio/readme is already on @readme/markdown@${VERSION}"
            exit 0
          fi

          git commit -m "chore: update @readme/markdown to v${VERSION}"
          git push --force-with-lease origin "${branch}"

          notes="$(gh release view --repo "${GITHUB_REPOSITORY}" "v${VERSION}" --json body --jq '.body // ""' || true)"
          {
            echo "## Changes"
            echo
            echo "- Updates \`@readme/markdown\` to *${VERSION}*"
            echo
            echo 'This ran `make upgrade-markdown` (peer range bump + root `npm install @readme/markdown@latest`).'
            echo 'Review CI, then approve and merge.'
            echo
            echo '## Release Notes'
            echo
            if [ -n "${notes}" ]; then
              printf '%s\n' "${notes}"
            else
              echo '_No release notes._'
            fi
            echo
            echo "[@readme/markdown@${VERSION}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION})"
            echo
            echo '---'
            echo
            echo "This PR was automatically created by the [update-downstream-deps](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) workflow."
          } > "${RUNNER_TEMP}/pr-body.md"

          existing="$(gh pr list --repo readmeio/readme --head "${branch}" --json url --jq '.[0].url // empty')"
          title="chore: update @readme/markdown to ${VERSION}"
          if [ -n "${existing}" ]; then
            gh pr edit --repo readmeio/readme "${branch}" --title "${title}" --body-file "${RUNNER_TEMP}/pr-body.md"
            echo "Updated PR: ${existing}"
          else
            gh pr create --repo readmeio/readme --base next --head "${branch}" --title "${title}" --body-file "${RUNNER_TEMP}/pr-body.md"
          fi
